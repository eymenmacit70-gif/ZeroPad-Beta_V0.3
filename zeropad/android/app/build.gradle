plugins {
    id "com.android.application"
}

android {
    namespace "com.zeropad.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.zeropad.app"
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName "0.2.1"
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

tasks.register("copyDebugApkToDist", Copy) {
    from(layout.buildDirectory.file("outputs/apk/debug/app-debug.apk"))
    into(new File(rootProject.projectDir.parentFile, "dist"))
    rename { "ZeroPad-debug.apk" }
}

afterEvaluate {
    tasks.named("assembleDebug").configure {
        finalizedBy(tasks.named("copyDebugApkToDist"))
    }
}
